name: Monthly status review

on:
  schedule:
    - cron: "30 12 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recheck ongoing disputes
        run: python3 scripts/monthly_update/monthly_update.py status --days 60
      - name: Open or update review pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/monthly-status-review
          delete-branch: true
          commit-message: "data: stage monthly status findings"
          title: "Monthly dispute status review"
          body: |
            Automated status candidates only. Confirm the evidence before approving any canonical change.
          labels: data-review

